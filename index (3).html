<!DOCTYPE html>
<html>
<head>
    <title>Simple News</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.5; }
        header { border-bottom: 1px solid #ccc; margin-bottom: 20px; }
        .date { color: gray; font-size: 0.9em; }
        h1 { margin: 10px 0; }
        img { width: 100%; border-radius: 4px; }
        .content { font-size: 1.1em; }
    </style>
</head>
<body>

<header>
    <strong>THE NEWS</strong>
</header>

<main>
    <p class="date">December 26, 2025</p>
    <h1>The Sun Shines Today</h1>
    
    <img src="https://images.unsplash.com/photo-1444676632488-26a136c45b9b?w=600" alt="News Image">

    <div class="content">
        <p>This is the first paragraph of your news story. It is short and easy to read.</p>
        <p>This is the second paragraph. Use simple sentences to share the most important facts quickly.</p>
    </div>
</main>

</body>
</html>
