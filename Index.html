<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
        }

        .container {
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        h2 {
            color: #3498db;
        }

        p {
            font-size: 18px;
        }

        img {
            width: 150px;
            border-radius: 50%;
            margin-top: 10px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #3498db;
            color: white;
            margin: 5px auto;
            padding: 10px;
            width: 200px;
            border-radius: 5px;
        }

        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 15px;
            box-shadow: 2px 2px 10px gray;
        }

        .btn:hover {
            background-color: #2c3e50;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hello, I'm Mohammed Farish 👋</h1>

    <img src="myphoto.jpg" alt="My Photo">

    <h2>About Me</h2>
    <p>I am learning web development and freelancing. I build simple and clean websites.</p>

    <h2>My Skills</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Contact</h2>
    <p>Email: farish@example.com</p>

    <button class="btn" onclick="showMessage()">Hire Me</button>

</div>

<script>
function showMessage() {
    alert("Thank you for visiting my website! 🚀");
}
</script>

</body>
</html>
